<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<meta name="description" content="This site is coming soon.">
<style>
  :root {
    --bg: #e1ad01;
    --fg: #1c1705;
    --muted: #4f4211;
    --line: #b78d01;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #e1ad01;
      --fg: #1c1705;
      --muted: #4f4211;
      --line: #b78d01;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  main {
    max-width: 34rem;
    text-align: center;
  }

  h1 {
    margin: 0 0 1rem;
    font-size: clamp(2rem, 6vw, 3.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  p {
    margin: 0;
    font-size: clamp(1rem, 2.5vw, 1.125rem);
    line-height: 1.6;
    color: var(--muted);
  }

  hr {
    width: 3rem;
    margin: 2rem auto 0;
    border: 0;
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
  <main>
    <h1>Coming soon</h1>
    <p>This site is under construction. Please check back shortly.</p>
    <hr>
  </main>
</body>
</html>
